[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-a-big-mac"
version = "0.3.0"
description = "Turn a Git release into a McDonald's release feast backed by MCP quotes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ddongdongdong" }]
dependencies = []

[project.scripts]
ship-a-big-mac = "ship_a_big_mac.cli:main"

[tool.setuptools]
packages = ["ship_a_big_mac"]

[tool.setuptools.package-data]
ship_a_big_mac = ["data/*.json"]
