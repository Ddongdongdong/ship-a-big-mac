name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify zero-token demo
        run: python -m ship_a_big_mac demo --output /tmp/release-receipt.svg
      - name: Verify one-command celebration
        run: python -m ship_a_big_mac celebrate --demo --non-interactive --scene comeback --people 5 --budget 180 --output-dir /tmp/celebration
